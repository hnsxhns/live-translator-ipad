# Publishes this site to GitHub Pages. The built-in Pages deploy gives up after 10 minutes, which is
# too short for the ~250 MB of speech models, so this one waits up to an hour.
name: Deploy to GitHub Pages
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
